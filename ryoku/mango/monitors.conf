# Written at runtime by the display tooling: one monitorrule per connected
# screen, with the scale and layout autoscale resolved.
#
#   monitorrule=name:eDP-1,scale:1.5,refresh:165
# `refresh` selects the panel rate; `rr` is the Wayland transform.
# Empty means mango uses each monitor's preferred mode at scale 1. Hand edits
# are lost on the next hotplug; put yours in monitors_user.conf, which loads
# after this file. mango's XWayland cannot take negative monitor coordinates,
# so the layout here is always clamped to positive origin.
