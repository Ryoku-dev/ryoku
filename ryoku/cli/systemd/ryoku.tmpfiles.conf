# /var/lib/ryoku: the boot guard's marker (root-owned). /var/lib/ryoku/boot:
# sticky and world-writable so a session can record that the desktop came up
# (ok-<uid>, written by the shell daemon) for the root-side guard to read.
# greeter-primary: the connector the session's Displays apply chose as main,
# written by that unprivileged session and read by the greeter (which runs as
# the sddm user). World-writable content in a root-owned directory: the session
# may rewrite the value but cannot replace the file.
d /var/lib/ryoku 0755 root root -
d /var/lib/ryoku/boot 1777 root root -
f /var/lib/ryoku/greeter-primary 0666 root root -
