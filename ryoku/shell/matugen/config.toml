[config]
reload_apps = true

# colors.json (the shell's own palette) is authored by the Go control plane;
# matugen fans that same palette into the core desktop surface below. These
# templates always render: the terminal, the Hyprland frame, the system
# monitor, and the Qt toolkit the shell itself is built on. The GTK / GUI-app
# fan-out lives in apps.toml, gated by the "Theme apps" toggle (theme.json
# themeApps), so a user can keep third-party apps stock while the shell tracks
# the palette.

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/current-theme.conf"
post_hook = "kitty @ set-colors --all --configured ~/.config/kitty/current-theme.conf || true"

[templates.hypr]
input_path = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.cache/ryoku/hypr-colors.lua"
post_hook = "hyprctl reload || true"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/ryoku.theme"
post_hook = "pkill -USR2 btop || true"

# Fastfetch reads the shared palette directly so custom ryoku:recolor roles see
# the same committed values as the shell. This compatibility render also provides
# a post-hook point that eagerly refreshes the effective config after each tint.
[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch-colors.json"
output_path = "~/.config/fastfetch/ryoku-colors.json"
post_hook = "sh -c 'ryoku-hub fastfetch effective \"${XDG_CACHE_HOME:-$HOME/.cache}/ryoku/fastfetch-effective.json\" >/dev/null 2>&1 || true'"

# The screen-share source chooser xdph launches. A core desktop surface, not a
# third-party app: it renders here so the chooser follows the wallpaper even
# with "Theme apps" off, instead of opening stock-grey in a themed session.
[templates.sharepicker]
input_path = "~/.config/matugen/templates/share-picker.css"
output_path = "~/.cache/ryoku/share-picker.css"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct-colors.conf"
output_path = "~/.config/qt6ct/colors/ryoku.conf"
    # Folder icons update directly from the committed shell palette.
    # Keep the existing Material cursor refresh for fixed Ryoku themes.
    post_hook = "command -v ryoku-cursor-material-recolor >/dev/null && ryoku-cursor-material-recolor; true"

# KDE apps resolve their colours through KColorScheme and ~/.config/kdeglobals,
# which the qt6ct palette never reaches. This renders the same roles in KDE's
# format; the daemon merges them so the rest of kdeglobals stays the user's.
[templates.kde]
input_path = "~/.config/matugen/templates/kdeglobals"
output_path = "~/.cache/ryoku/kdeglobals-colors.conf"

# Nomarchy keeps the generated wallpaper palette staged here even while one of
# its named themes is selected. The daemon publishes the pair atomically only
# when "Wallpaper (Ryoku)" owns the Nomarchy surfaces.
[templates.nomarchy]
input_path = "~/.config/matugen/templates/nomarchy-colors.toml"
output_path = "~/.cache/ryoku/nomarchy-colors.toml"
