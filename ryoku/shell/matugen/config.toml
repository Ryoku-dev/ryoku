[config]

# colors.json (the shell's own palette) is authored by the Go control plane;
# matugen fans that same palette into the core desktop surface below. These
# templates always render: the terminal, the Hyprland frame, the system
# monitor, and the Qt toolkit the shell itself is built on. The GTK / GUI-app
# fan-out lives in apps.toml, gated by the "Theme apps" toggle (theme.json
# themeApps), so a user can keep third-party apps stock while the shell tracks
# the palette.

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/current-theme.conf"

[templates.hypr]
input_path = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.cache/ryoku/hypr-colors.lua"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/ryoku.theme"

# The screen-share source chooser xdph launches. A core desktop surface, not a
# third-party app: it renders here so the chooser follows the wallpaper even
# with "Theme apps" off, instead of opening stock-grey in a themed session.
[templates.sharepicker]
input_path = "~/.config/matugen/templates/share-picker.css"
output_path = "~/.cache/ryoku/share-picker.css"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct-colors.conf"
output_path = "~/.config/qt6ct/colors/ryoku.conf"
    # Once the palette is fanned out, retint the file-manager folder icons to the
    # same accent (ryoku-cmd-folders), recolour the Material Bibata pointer
    # (ryoku-cursor-material-recolor), and synchronize keyboard RGB backlights
    # (ryoku-cmd-keyboard-rgb). Riding matugen's post_hook fires on every palette
    # change from either path (follow-wallpaper and fixed schemes), so they need
    # no wiring in the Go daemon.
    post_hook = "command -v ryoku-cmd-folders >/dev/null && ryoku-cmd-folders; command -v ryoku-cursor-material-recolor >/dev/null && ryoku-cursor-material-recolor; command -v ryoku-cmd-keyboard-rgb >/dev/null && ryoku-cmd-keyboard-rgb; true"

# KDE apps resolve their colours through KColorScheme and ~/.config/kdeglobals,
# which the qt6ct palette never reaches. This renders the same roles in KDE's
# format; the daemon merges them so the rest of kdeglobals stays the user's.
[templates.kde]
input_path = "~/.config/matugen/templates/kdeglobals"
output_path = "~/.cache/ryoku/kdeglobals-colors.conf"
