# Ryoku palette for yazi. Rendered by the theme daemon; do not edit.
#
# yazi reads theme.toml beside yazi.toml. Ryoku ships only yazi.toml, so this
# file is the daemon's alone and clobbers nothing you wrote.

[flavor]
use = ""

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }

# Selection & Hover
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
preview_hovered = { underline = true }

find_keyword = { fg = "{{colors.tertiary.default.hex}}", bold = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bold = true }

# Markers & Counts
marker_copied = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

count_copied = { fg = "{{colors.on_tertiary_container.default.hex}}", bg = "{{colors.tertiary_container.default.hex}}" }
count_cut = { fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" }
count_selected = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

# Tabs & Window Frame
tab_active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
tab_inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

synced_title = { fg = "{{colors.secondary.default.hex}}" }
border_symbol = "│"
border_style = { fg = "{{colors.outline_variant.default.hex}}" }

[indicator]
parent  = { fg = "{{colors.secondary.default.hex}}", bold = true }
current = { fg = "{{colors.primary.default.hex}}", bold = true }
preview = { fg = "{{colors.outline.default.hex}}", bold = true }
padding = { open = "", close = " " }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
unset_main = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
permissions_t = { fg = "{{colors.primary.default.hex}}" }
permissions_r = { fg = "{{colors.tertiary.default.hex}}" }
permissions_w = { fg = "{{colors.error.default.hex}}" }
permissions_x = { fg = "{{colors.secondary.default.hex}}" }
permissions_s = { fg = "{{colors.outline.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.on_surface.default.hex}}" }
value = { fg = "{{colors.on_surface.default.hex}}" }
selected = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
inactive = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.tertiary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[confirm]
border = { fg = "{{colors.primary.default.hex}}" }
title  = { fg = "{{colors.primary.default.hex}}" }
body   = { fg = "{{colors.on_background.default.hex}}" }
list   = { fg = "{{colors.on_background.default.hex}}" }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
btn_no  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
btn_labels = [ " Yes ", " No " ]

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[tasks]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}", underline = true }

[which]
cols = 3
mask = { bg = "{{colors.surface_container.default.hex}}" }
cand = { fg = "{{colors.secondary.default.hex}}" }
rest = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc = { fg = "{{colors.tertiary.default.hex}}" }
separator = " → "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[help]
on = { fg = "{{colors.secondary.default.hex}}" }
run = { fg = "{{colors.tertiary.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
footer = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
desc   = { fg = "{{colors.on_background.default.hex}}" }

[notify]
title_info = { fg = "{{colors.primary.default.hex}}" }
title_warn = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

# Filetype highlighting using valid M3 tokens (replaces color1-color7)
[filetype]
rules = [
	{ mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
	{ mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
	{ mime = "application/{zip,gzip,x-tar,x-bzip2,x-7z-compressed,x-rar,vnd.rar,x-xz,zstd}", fg = "{{colors.error.default.hex}}" },
	{ url = "*", is = "orphan", fg = "{{colors.error.default.hex}}", bold = true },
	{ url = "*", is = "exec", fg = "{{colors.secondary.default.hex}}", bold = true },
	{ url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
	{ url = "*", fg = "{{colors.on_surface.default.hex}}" },
]

