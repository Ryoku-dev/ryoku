id = "kairos"
name = "Kairos"
version = "1.0.0"
summary = "A clock island that grows into controls and tools."
description = "Kairos keeps a compact clock island at rest, then expands into music, quick settings, and a matching application launcher."
license = "GPL-3.0-or-later"
authors = ["Ryoku Team"]
tags = ["island", "clock", "launcher"]
accent = "#f1b85b"
surface = "#14120f"
preview = "preview.webp"
official = true

[shell]
entry = "qml/Scene.qml"
frameHost = "each"
owns = []
modules = []

[shell.settings]
ipc = "kairos"
call = "settings"
args = []
hubEditor = ""

[[provides.launcher]]
id = "kairos"
name = "Kairos"
description = "The Kairos clock island expands into app search."
entry = "qml/launcher/Main.qml"
preview = "qml/launcher/Preview.qml"
