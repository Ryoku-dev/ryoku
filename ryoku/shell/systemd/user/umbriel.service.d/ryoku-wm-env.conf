[Service]
# start-umbriel imports the login environment into the user manager but only
# unsets a fixed list of stale compositor keys, which does not include
# RYOKU_WM. After switching away from another compositor its forced provider
# tag can survive into this session, making every Ryoku process pick a dead
# provider. Clear it before the compositor starts so the seam falls back to
# the live UMBRIEL_SOCKET handle. The same applies to niri's session on the
# way back, where start-umbriel is the last writer before the desktop runs.
UnsetEnvironment=RYOKU_WM
ExecStartPre=-/usr/bin/systemctl --user unset-environment RYOKU_WM
