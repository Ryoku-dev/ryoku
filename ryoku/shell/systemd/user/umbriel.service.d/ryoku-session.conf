[Unit]
# Umbriel does not pull Ryoku's desktop target in on its own the way the niri
# session does. Without this the compositor comes up bare: no bar, dock or
# wallpaper, because ryoku-shell.service is only WantedBy=ryoku-session.target.
# No After here: ryoku-session.target already waits on graphical-session.target,
# which umbriel.service is ordered before, so an After would form a cycle.
Wants=ryoku-session.target
