# Ryoku prefers Wayland for GTK applications through GDK_BACKEND, but
# xdg-desktop-portal-gnome uses the presence of that override when deciding
# whether it is running on a compatible GNOME/Niri session. When inherited
# under Niri it exposes Settings only and drops the ScreenCast interface.
#
# Keep the application-wide preference while removing it only from this
# portal backend.
[Service]
UnsetEnvironment=GDK_BACKEND
