[Service]
# niri-session imports the login environment into the user manager after
# unsetting a fixed list of stale compositor keys, which does not include
# RYOKU_WM. After switching away from another compositor its forced provider
# tag can survive into this session. Clear it before the compositor starts so
# the seam falls back to the live NIRI_SOCKET handle.
UnsetEnvironment=RYOKU_WM
ExecStartPre=-/usr/bin/systemctl --user unset-environment RYOKU_WM
