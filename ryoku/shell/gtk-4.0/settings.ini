# A bare Wayland session runs no xsettings daemon, so the icon, cursor and font
# names never reach apps that read only ~/.config/gtk-4.0/settings.ini (they
# never see gsettings). This file is that on-disk baseline for the default dark
# session; gsettings is authoritative and the shell rewrites it on every palette
# or mode change, so a light session is correct everywhere that reads it.
#
# No prefer-dark key here: GTK 4 dropped it, and libadwaita takes light or dark
# from color-scheme instead.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=ryoku-folders
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-font-name=Geologica 10
