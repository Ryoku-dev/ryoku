# Wayfire implements no portal backend of its own, so screen sharing rides
# the GNOME backend (caps report PortalBackend "gnome", and the variant
# package depends on xdg-desktop-portal-gnome). The GNOME FileChooser,
# though, hangs under a non-GNOME session, so file pickers never open; route
# that one interface to the GTK backend, which works everywhere. Everything
# else keeps the GNOME default so recording and screenshots stay intact.
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.FileChooser=gtk
