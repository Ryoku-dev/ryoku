# Ryoku's baseline Wayfire configuration.
#
# The first layer of the composed wayfire.ini: `ryoku wm apply` lays the
# settings store over this file, then the machine's monitors.ini,
# keyboard.ini and user.ini win key by key. Every update replaces this file,
# so never edit it; your changes belong in user.ini.
#
# Every section below belongs to a plugin in core.plugins (or to core
# itself), so everything here actually runs.

[core]

# The session's plugins, alphabetical. Some carry settings or verbs the rest
# of the desktop leans on, so they must stay listed: animate (animations and
# their durations), autostart (the store's startup rows), command and
# decoration (the store's binds and borders), fast-switcher (Alt-Tab),
# foreign-toplevel (the shell's window presence — without it the compositor
# never advertises toplevels and hasWindowsOnActiveWorkspace stays empty),
# vswipe (the workspace gesture), window-rules (the store's window rules),
# wm-actions (the fullscreen act), ipc and ipc-rules (state, watch and every
# act). apply removes animate and blur again when their store toggles are off.
plugins = \
  animate \
  autostart \
  blur \
  command \
  decoration \
  depthdeck \
  fast-switcher \
  foreign-toplevel \
  grid \
  ipc \
  ipc-rules \
  move \
  place \
  resize \
  vswipe \
  vswitch \
  window-rules \
  wm-actions \
  wobbly \
  zoom

# Workspaces in a 3 x 3 grid.
vwidth = 3
vheight = 3

# Prefer the application's own decoration when it draws one; wayfire's
# borders cover the rest.
preferred_decoration_mode = client

# Drag windows with Super and the left mouse button.
[move]
activate = <super> BTN_LEFT

# Resize with Super and the right mouse button.
[resize]
activate = <super> BTN_RIGHT

# Zoom the desktop with Super and the scroll wheel.
[zoom]
modifier = <super>

# Wayfire is the only Ryoku compositor with a title bar: hyprland and niri
# draw borders and nothing else, so zero the height and leave decoration as
# the border for windows that do not draw their own chrome.
[decoration]
title_height = 0

# The login bootstrap: everything a Ryoku session brings up when wayfire
# starts, the wayfire sibling of hyprland's autostart.lua and niri's
# autostart.kdl. The plugin runs each row through `sh`; the store's own rows
# land beside these as ryoku_NN keys and win per key.
#
# wf-panel and wf-background stay out: the plugin defaults to starting them,
# and the shell on this desktop is Quickshell, not wayfire's own clients.
[autostart]
autostart_wf_shell = false

10_keyring = gnome-keyring-daemon --start --components=secrets,pkcs11

10_color = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
# adw-gtk3-dark, not Adwaita-dark: stock Adwaita GTK3 hardcodes its colours,
# while adw-gtk3 derives from the named colours the daemon emits. The daemon
# owns accent-color, so it is not set here.
10_gtk = gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark

# Folder icons tinted to the wallpaper accent, rebuilt on every palette change.
10_folders = command -v ryoku-cmd-folders >/dev/null 2>&1 && ryoku-cmd-folders

# The session, in one chained command: a separate shell start would race the
# env import, and losing means ConditionEnvironment=WAYLAND_DISPLAY skips the
# unit (a black desktop). Push the compositor env into the user manager (wayfire
# exports XDG_CURRENT_DESKTOP=wayfire itself, so the portal routing below
# resolves), pick up freshly laid units, raise the reload cover over the bare
# compositor, then session-start does the guarded restarts and does not return
# until the shell and lid owners prove readiness; the fresh shell finishes the
# cover once wallpaper and desktop report ready. Portals restart last so a
# stale frontend cannot proxy ScreenCast requests to the dead backend: wayfire
# implements no portal of its own, so screensharing rides the GNOME backend
# (wayfire-portals.conf).
0_session = dbus-update-activation-environment --systemd --all; systemctl --user daemon-reload; ryoku-reload-cover begin boot || true; ryoku-power-cutover session-start-logged && systemctl --user try-restart xdg-desktop-portal.service xdg-desktop-portal-gnome.service xdg-desktop-portal-gtk.service

# Per-device Bluetooth codec memory: WirePlumber restores a device's profile
# across reconnects but not its A2DP codec, so reconcile on every card event.
# A no-op for anyone who never chose a codec.
20_bt = command -v ryoku-bt-audio >/dev/null 2>&1 && ryoku-bt-audio watch

# Record the keyring mode once and seed a blank passwordless default, so no
# app prompts for a keyring password. Idempotent once a mode is set.
20_keyring = command -v ryoku >/dev/null 2>&1 && ryoku keyring init

20_gpu = command -v ryoku-gpu >/dev/null 2>&1 && ryoku-gpu persist
# Battery charge ceiling and PCIe link policy are sysfs values the kernel
# forgets across a reboot, so a stored choice is pushed back at login. A no-op
# with no power.json and on a box without the knobs.
20_power = command -v ryoku-power >/dev/null 2>&1 && ryoku-power apply

# The stored lighting look back at adopted keyboards and mice. A no-op until
# lighting is on with a device adopted.
20_lighting = command -v ryoku-hub >/dev/null 2>&1 && ryoku-hub lighting apply
20_mic = command -v ryoku-mic >/dev/null 2>&1 && ryoku-mic

# Restore the warm screen when night light was left on; the process a reboot
# drops. A no-op when it was off or absent.
20_nightlight = command -v ryoku-cmd-nightlight >/dev/null 2>&1 && ryoku-cmd-nightlight restore

# Booted into a btrfs snapshot from the boot menu: offer the one-click restore.
# A normal boot detects no snapshot and exits silently.
20_snapshot = command -v limine-snapper-restore >/dev/null 2>&1 && limine-snapper-restore --notify

# Seed voxtype's config and user service with the built-in hotkey off (the
# shell owns Super+`); starts unless dictation was turned off in the Hub.
20_voxtype = command -v voxtype >/dev/null 2>&1 && command -v ryoku-hub >/dev/null 2>&1 && ryoku-hub voxtype ensure >/dev/null 2>&1

# Seed the empty AI-translation key file so Language > Generate with AI reads it.
20_i18n = command -v ryoku-i18n >/dev/null 2>&1 && ryoku-i18n ensure >/dev/null 2>&1

# Welcome tour (once per tour version) and the first-boot keyboard hint (exactly
# once ever); the behaviour lives in ryoku-session-intro so every compositor's
# autostart calls the same script.
30_intro = command -v ryoku-session-intro >/dev/null 2>&1 && ryoku-session-intro welcome
30_keys = command -v ryoku-session-intro >/dev/null 2>&1 && ryoku-session-intro keys-hint

# Everyday commands. apply writes the catalogue's binds here as
# binding_<id>/command_<id> pairs, and the store's own keybinds land beside
# them as ryoku_N.
[command]

# Alt-Tab through the windows; the reverse direction follows.
[fast-switcher]
activate_forward = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB

# Tile the focused window into screen regions, Super, Ctrl and a keypad key
# per slot. The arrows belong to the catalogue's focus rows, so the shipped
# grid holds the keypad alone.
[grid]
slot_bl = <ctrl> <super> KEY_KP1
slot_b = <ctrl> <super> KEY_KP2
slot_br = <ctrl> <super> KEY_KP3
slot_l = <ctrl> <super> KEY_KP4
slot_c = <ctrl> <super> KEY_KP5
slot_r = <ctrl> <super> KEY_KP6
slot_tl = <ctrl> <super> KEY_KP7
slot_t = <ctrl> <super> KEY_KP8
slot_tr = <ctrl> <super> KEY_KP9
# Restore the default geometry.
restore = <ctrl> <super> KEY_KP0

# Workspace movement; the store writes the switch duration and apply the
# workspace binds into this section. Super, Ctrl and the bare arrows are the
# catalogue's resize rows, so only the window-taking switches stay here.
[vswitch]
# Move the focused window with the workspace in that direction.
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_down = <ctrl> <super> <shift> KEY_DOWN
with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT
