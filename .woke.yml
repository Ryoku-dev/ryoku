# woke config. defaults apply. paths below are skipped: vendored upstream,
# binary blobs, or verbatim license text we didn't write.
ignore_files:
  - ryoku/lockscreen/qylock/**
  - ryoku/assets/**
  - LICENSE
  - LICENSES/**
  - NOTICE
  - "**/*.svg"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.webp"
  - "**/*.ttf"
  # machine-generated translations: derived from source strings (e.g. Hyprland's
  # window new_status values), not hand-authored, so we do not lint them.
  - ryoku/i18n/catalog/**
  # vendored upstream modules we do not author.
  - "**/vendor/**"
  # the typing test's word lists are frequency dictionaries of English, not prose
  # we write, so a common word in them is data.
  - ryoku/shell/quickshell/keys/typing/assets/languages/**

# `blacklist` is the exact modprobe.d directive Ryoku writes and greps for to keep
# nouveau from racing the NVIDIA driver (system/hardware/drivers/*, the doctor's
# reconcile_hardware.go, their tests, and the changelogs describing them). It is
# kernel syntax, not a word choice, and every occurrence in the tree is that one
# legitimate use, so neutralize woke's default blacklist rule (empty terms) instead
# of ignoring whole files, which would drop all their other lint.
# `slave` is the same class: it is the literal value Hyprland's master:new_status
# keyword accepts, the store default, and the word our own schema description
# names it with, so renaming it would break the setting rather than the lint.
rules:
  - name: blacklist
    terms: []
    alternatives: []
    severity: info
  - name: slave
    terms: []
    alternatives: []
    severity: info
