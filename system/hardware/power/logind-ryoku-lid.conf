# Ryoku's logind policy, shipped by ryoku-desktop to
# /etc/systemd/logind.conf.d/10-ryoku-lid.conf.
#
# Inside a Ryoku session, ryoku-clamshell's low-level handle-lid-switch
# inhibitor gives the compositor event path sole ownership: docked sessions stay
# awake and every other close goes through `ryoku-shell suspend`. Outside a
# session there is no such owner, so logind retains its normal safe policy for
# the greeter, logout, and boot.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# The bounded budget for the foreground shell's final compositor-secure qylock
# handshake. Other online sessions are already covered by session-scoped qylock
# clients before ownership or the durable cutover block can move.
InhibitDelayMaxSec=15
