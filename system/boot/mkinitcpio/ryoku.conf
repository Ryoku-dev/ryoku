# initramfs HOOKS, dropped into /etc/mkinitcpio.conf at install.
#
# 'ryoku-console-keys' runs after 'udev' and before 'plymouth'. Its install hook
# carries /etc/vconsole.conf into the image so Plymouth uses the keyboard layout
# picked in the installer instead of falling back to US. Its runtime hook turns
# Num Lock on for every console before disk unlock. Plymouth starts next so the
# splash still owns the screen as soon as possible. 'kms' loads the GPU driver
# inside the initramfs for a flicker-free handoff to Plymouth and the DM.
#
# 'ryoku-gpu-trim' sits between 'autodetect' and 'kms', the only place it works:
# it drops the denylisted nouveau from autodetect's allowlist, which is what
# 'kms' filters against, so nouveau and the ~100 MiB of GSP firmware it pulls
# stay out of the image. See system/boot/mkinitcpio/install/ryoku-gpu-trim.
#
# 'encrypt' = LUKS only. installer keeps it for encrypted root, strips it
# otherwise so plain systems don't drag in cryptsetup for nothing (the
# installer's `sed 's/ encrypt\b//'` deletes exactly that one word).
#
# 'resume' comes right AFTER 'encrypt' (so a LUKS root is unlocked before the
# hook looks for the swapfile) and stays a separate word, so the encrypt-strip
# above never touches it. it restores a hibernation image when the bootloader
# passes resume=/resume_offset= (set only when a swapfile exists); with no such
# cmdline it is a harmless no-op, so keeping it on every install is safe.

HOOKS=(base udev ryoku-console-keys plymouth keyboard autodetect ryoku-gpu-trim microcode modconf kms keymap consolefont block encrypt resume filesystems fsck)
