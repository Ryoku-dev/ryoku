# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit AI review for Ryoku Arch. Free for public repositories.
#
# Reviews are grounded in the repo's own standards: the coding-guidelines
# feature below feeds AGENTS.md (the cardinal rules), CONTRIBUTING.md and the
# docs/ guides to the reviewer, so its feedback matches this project rather
# than generic advice. Linters (shellcheck, golangci-lint, actionlint,
# yamllint, gitleaks, ruff, markdownlint) are on by default and run by file
# type; the path_filters below keep them off vendored and generated files.
language: "en-US"
early_access: false

reviews:
  # More thorough feedback: a solo maintainer wants the extra pair of eyes.
  profile: assertive
  # Approve once its comments are resolved and required checks are green.
  request_changes_workflow: true
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  # Single maintainer: no reviewer suggestions, no poem.
  suggested_reviewers: false
  poem: false
  collapse_walkthrough: false

  auto_review:
    enabled: true
    # Re-review on every push so a PR stays covered as it evolves.
    auto_incremental_review: true
    # Drafts are still cooking; review once marked ready.
    drafts: false
    # Default branch (main) is always covered; add the integration branch
    # that feature PRs actually target.
    base_branches:
      - "^unstable-dev$"
      - "^main$"
    ignore_title_keywords:
      - "wip"

  # Only review hand-written source. Vendored Go, generated type stubs and the
  # machine-translated locale files (regenerated by i18n-sync, English is the
  # single source) are never reviewed. These patterns also scope the linters.
  path_filters:
    - "!**/vendor/**"
    - "!ryoku/cli/vendor/**"
    - "!ryoku/rashin/internal/skills/sets/**"
    - "!**/*.qmltypes"
    - "!ryoku/ui/translations/es.json"
    - "!ryoku/ui/translations/fr.json"
    - "!ryoku/ui/translations/pt.json"
    - "!ryoku/ui/translations/pt_BR.json"
    - "!**/*.lock"
    - "!**/go.sum"

  path_instructions:
    - path: "**/*"
      instructions: >-
        Enforce the mechanical rules from CONTRIBUTING.md that are easy to miss:
        one logical change per PR; the commit subject is "[area] scope: summary"
        with area one of global, installation, system, ryoku, docs, test,
        tooling or release, at most 72 characters, no trailing period; never an
        em-dash (U+2014) or en-dash (U+2013) anywhere in code, comments or
        messages; no authorship or attribution trailers and no AI self-narration
        in comments. Flag dead or commented-out code and duplicated config.
    - path: "ryoku/**"
      instructions: >-
        Ryoku desktop. Enforce the delivery contract from docs/updates.md: a
        user-facing config must be shipped by a package or seeded by the
        installer, never hand-edited into a live path; user edits belong in the
        user_edits overlay. A removed or renamed shell.json key needs a doctor
        reconciler. Flag a user-facing change that lacks a matching CHANGELOG.md
        note in the area it touches.
    - path: "ryoku/hyprland/**/*.lua"
      instructions: >-
        The Hyprland config is authored as Lua modules, one concern per file.
        Never introduce a hand-written raw hyprland.conf. Check that the module
        would parse with luac -p.
    - path: "**/*.qml"
      instructions: >-
        Qt Quick / Quickshell. One component per file. Flag hardcoded colors
        where a theme token exists, unqualified property access, and properties
        that should be readonly. Assume qmllint runs in CI.
    - path: "**/*.go"
      instructions: >-
        Idiomatic Go. Every error is checked and wrapped with context; no panics
        on recoverable paths; avoid needless allocation on hot paths. Assume
        go vet and go test run in CI.
    - path: "**/*.sh"
      instructions: >-
        Bash scripts start with "set -euo pipefail", quote their expansions, and
        must pass shellcheck. Reuse the repo's existing helpers over adding new
        ones.

# Ground the reviewer in the project's documented standards. CodeRabbit reads
# these files and reviews against them (AGENTS.md is a default; the rest are
# this repo's rulebook).
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/conventions.md"
      - "docs/development.md"
      - "docs/structure.md"
      - "docs/updates.md"
      - "docs/ui-ux.md"

chat:
  auto_reply: true
