<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compact machine detail</title>
  <link rel="stylesheet" href="../../library/web/lithic.css">
  <style>
    html, body { margin: 0; }
    .sheet { width: 1440px; height: 900px; overflow: hidden; display: grid; place-items: stretch center; }
    .compact-window { width: 720px; height: 900px; }
    .compact-window .l-app-frame { height: 900px; min-height: 900px; }
    .compact-detail { display: grid; align-content: start; gap: var(--lithic-space-s4); }
    .compact-head { display: flex; align-items: center; gap: var(--lithic-space-s3); }
    .compact-head h1 { margin: 0; }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="compact-window">
      <div class="l-app-frame" data-l-no-list data-l-preview-size="compact" data-l-size-class="compact">
        <nav class="l-rail" aria-label="Compact Ryoport navigation">
          <a class="l-rail-home l-cut" href="now.html" aria-label="Now"><span class="l-brand-mark" aria-hidden="true"></span><span class="l-rail-label">Now</span></a>
          <div class="l-rail-primary"><a class="l-rail-destination l-cut" href="fleet.html" aria-current="page"><span class="l-glyph" aria-hidden="true">dns</span><span class="l-rail-label">Fleet</span></a><button class="l-new-plaque l-cut" type="button" aria-label="New"><span class="l-glyph" aria-hidden="true">add</span><span class="l-rail-label">New</span></button><a class="l-rail-destination l-cut" href="becoming.html"><span class="l-glyph" aria-hidden="true">history</span><span class="l-rail-label">Activity</span></a></div>
          <a class="l-rail-destination l-rail-settings l-cut" href="settings.html"><span class="l-glyph" aria-hidden="true">tune</span><span class="l-rail-label">Settings</span></a>
        </nav>
        <section class="l-app-frame-pane l-app-frame-work l-cut compact-detail" aria-labelledby="tile-title">
          <header class="compact-head"><button class="l-icon-plaque l-quiet" type="button" aria-label="Back to Fleet"><span class="l-glyph" aria-hidden="true">arrow_back</span></button><h1 class="l-type-section" id="tile-title">Machine detail</h1></header>
          <header class="l-header l-mineral-field" data-tone="alive"><div class="l-header__identity"><span class="l-header__mark"><span class="l-glyph" aria-hidden="true">memory</span></span><h2 class="l-header__name">alpine-instant</h2></div><p class="l-header__proof">Running · 12 min</p><p class="l-header__note">ally at ops@192.0.2.18</p><div class="l-marks"><span class="l-marks__mark l-disposable">Disposable</span><span class="l-marks__mark">Instant</span></div><div class="l-header__acts"><button class="l-plaque l-tonal" type="button">Open console</button><button class="l-plaque l-danger-line" type="button">Stop</button></div></header>
          <div class="l-tabs" role="tablist" aria-label="Machine details"><span class="l-tabs-blade" aria-hidden="true"></span><button class="l-tab" type="button" role="tab" aria-selected="true" aria-controls="compact-overview" id="compact-overview-tab">Overview</button><button class="l-tab" type="button" role="tab" aria-selected="false" aria-controls="compact-console" id="compact-console-tab" tabindex="-1">Console</button><button class="l-tab" type="button" role="tab" aria-selected="false" aria-controls="compact-network" id="compact-network-tab" tabindex="-1">Network</button></div>
          <div id="compact-overview" role="tabpanel" aria-labelledby="compact-overview-tab"><section class="l-section"><h2 class="l-section__title">Machine</h2><div class="l-slab l-cut"><dl class="l-facts"><div class="l-facts__row"><dt>Server</dt><dd>ally</dd></div><div class="l-facts__row"><dt>Image</dt><dd>alpine-instant</dd></div><div class="l-facts__row"><dt>CPU</dt><dd>8%</dd></div><div class="l-facts__row"><dt>Memory</dt><dd>382 MiB</dd></div><div class="l-facts__row"><dt>State</dt><dd><span class="l-claim" data-tone="alive"><span class="l-flake" data-tone="alive" aria-hidden="true"></span>Running</span></dd></div></dl></div></section></div>
          <div id="compact-console" role="tabpanel" aria-labelledby="compact-console-tab" hidden></div><div id="compact-network" role="tabpanel" aria-labelledby="compact-network-tab" hidden></div>
        </section>
      </div>
    </div>
  </main>
  <script type="module">
    import Lithic from '../../library/web/lithic.js';
    Lithic.init();
  </script>
</body>
</html>
