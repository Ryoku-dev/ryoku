name: AI usage collector

# The QS Bar AI usage pill reads caches written by ryoku/rashin/usage/opencode-usage,
# which walks OpenCode's local session store. That store has changed shape twice
# (file-per-message JSON, then a sqlite message table, then the 2.x
# session_message table), and each move silently emptied the OpenCode card
# because the collector kept reading the retired layout (#365). The fixture test
# builds a throwaway store in every layout and asserts the collector still
# reports real tokens, so a future OpenCode schema move fails here rather than
# on a user's bar. See tests/opencode-usage.sh.

on:
  pull_request:
    paths:
      - 'ryoku/rashin/usage/opencode-usage'
      - 'ryoku/rashin/usage/codex-usage'
      - 'ryoku/shell/quickshell/inir/defaults/widgets/ai-usage/**'
      - 'tests/opencode-usage.sh'
      - 'tests/codex-usage.sh'
      - 'tests/codex-usage-regression.py'
      - 'tests/ai-usage-cache.py'
      - 'tests/ai-usage-widget.py'
      - 'tests/custom-widget-install.py'
      - 'ryoku/shell/quickshell/inir/services/CustomWidgets.qml'
      - 'ryoku/shell/quickshell/inir/modules/iris/settings/IrisOptions.qml'
      - 'ryoku/shell/quickshell/inir/modules/iris/bar/IrisCustomModule.qml'
      - 'ryoku/shell/quickshell/inir/modules/background/widgets/WidgetManagerPanel.qml'
      - '.github/workflows/ai-usage-collector.yml'
  push:
    branches:
      - main
      - unstable-dev
    paths:
      - 'ryoku/rashin/usage/opencode-usage'
      - 'ryoku/rashin/usage/codex-usage'
      - 'ryoku/shell/quickshell/inir/defaults/widgets/ai-usage/**'
      - 'tests/opencode-usage.sh'
      - 'tests/codex-usage.sh'
      - 'tests/codex-usage-regression.py'
      - 'tests/ai-usage-cache.py'
      - 'tests/ai-usage-widget.py'
      - 'tests/custom-widget-install.py'
      - 'ryoku/shell/quickshell/inir/services/CustomWidgets.qml'
      - 'ryoku/shell/quickshell/inir/modules/iris/settings/IrisOptions.qml'
      - 'ryoku/shell/quickshell/inir/modules/iris/bar/IrisCustomModule.qml'
      - 'ryoku/shell/quickshell/inir/modules/background/widgets/WidgetManagerPanel.qml'
      - '.github/workflows/ai-usage-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-usage:
    name: The collector reads every OpenCode store layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Store-layout fixture test
        shell: bash
        run: bash tests/opencode-usage.sh

      - name: Codex rollout fixture test
        shell: bash
        run: bash tests/codex-usage.sh

      - name: Set up Node for widget parser checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Codex replay and quota-window regression tests
        run: python3 tests/codex-usage-regression.py

      - name: Widget cache contract
        shell: bash
        run: python3 tests/ai-usage-cache.py

      - name: Widget calendar and shared-loader compatibility
        run: |
          python3 tests/ai-usage-widget.py
          python3 tests/custom-widget-install.py
