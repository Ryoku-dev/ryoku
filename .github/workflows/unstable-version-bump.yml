name: Unstable Version Bump

# VERSION on unstable-dev names the next stable release: one roll past what main
# carries (main 1.0.8 -> unstable 1.0.9; a roll carries into the minor past 9,
# 1.0.9 -> 1.1.0). Pushes no longer move it; testing builds stay distinct and
# increasing through their build number and r<commit count>. After a release
# lands on main this catches VERSION up to the next one. A VERSION hand-set at
# or above that (the next release is a minor or a major) is left alone, and so
# is a push that edits VERSION itself.

on:
  push:
    branches: [unstable-dev]

permissions:
  contents: write

concurrency:
  group: unstable-version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Keep VERSION on the next release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unstable-dev
        uses: actions/checkout@v4
        with:
          ref: unstable-dev
          fetch-depth: 0

      - name: Name the next release after main
        shell: bash
        run: |
          set -euo pipefail

          # pushes made with the default GITHUB_TOKEN do not retrigger
          # workflows, so the bot's own commit can't loop.
          before="${{ github.event.before }}"
          [[ $before =~ ^0+$ ]] && before="HEAD~1"
          if ! git diff --quiet "$before" HEAD -- VERSION; then
            echo "VERSION was hand-set in this push; leaving it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch --quiet origin main
          main="$(git show origin/main:VERSION | tr -d '[:space:]')"
          was="$(tr -d '[:space:]' < VERSION)"
          next="$(./bin/ryoku-release-bump roll keep "$main")"
          # never lower VERSION: package versions follow it
          if [[ $(printf '%s\n' "$next" "$was" | sort -V | tail -n1) == "$was" ]]; then
            echo "VERSION $was already names a release after main's $main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "$next" > VERSION

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add VERSION
          git commit -m "release: bump unstable to $next"

          # land on top of anything that arrived while we were building.
          git pull --rebase origin unstable-dev
          git push origin HEAD:unstable-dev

          {
            echo "### Next release"
            echo
            echo "- main: \`$main\`"
            echo "- Was: \`$was\`"
            echo "- Now: \`$next\`"
          } >> "$GITHUB_STEP_SUMMARY"
