name: NVIDIA guard

# Guards both package-manager paths that prevent a failed NVIDIA module build
# from hiding nouveau. The pacman hook heals existing installs; Void's kernel
# hook runs after DKMS and before dracut. Driver selection tests cover the
# generation map without a GPU or root access.

on:
  pull_request:
    paths:
      - 'system/hardware/drivers/ryoku-nvidia-guard'
      - 'system/hardware/drivers/nvidia.sh'
      - 'system/hardware/drivers/nvidia-xbps.sh'
      - 'system/hardware/drivers/15-ryoku-nvidia'
      - 'tests/nvidia-guard.sh'
      - 'tests/nvidia-driver-selection.sh'
      - 'tests/nvidia-xbps.sh'
      - '.github/workflows/nvidia-guard.yml'
  push:
    branches:
      - main
    paths:
      - 'system/hardware/drivers/ryoku-nvidia-guard'
      - 'system/hardware/drivers/nvidia.sh'
      - 'system/hardware/drivers/nvidia-xbps.sh'
      - 'system/hardware/drivers/15-ryoku-nvidia'
      - 'tests/nvidia-guard.sh'
      - 'tests/nvidia-driver-selection.sh'
      - 'tests/nvidia-xbps.sh'
      - '.github/workflows/nvidia-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nvidia-guard:
    name: nvidia-guard heal and no-op
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run nvidia-guard test
        shell: bash
        run: bash tests/nvidia-guard.sh

      - name: Run NVIDIA driver selection test
        shell: bash
        run: bash tests/nvidia-driver-selection.sh

      - name: Run Void NVIDIA driver test
        shell: bash
        run: bash tests/nvidia-xbps.sh
