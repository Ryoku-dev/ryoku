name: i18n

# Run this by hand from the Actions tab, or with
# `gh workflow run i18n.yml --ref unstable-dev`, after English copy changes.
# It extracts the English source, translates only the strings each language is
# missing, and commits the result back. Human fixes in overrides/<lang>.json
# are preserved.
#
# Each language is its own job, so a full catalogue pass fits the runner limit
# and a language that fails (credits, a provider outage) does not throw away
# the ones that finished. The commit goes back to the branch the workflow was
# dispatched on, so translations still flow to main through the normal
# fast-forward.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate every string (upgrade existing), not just missing ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    name: Extract English
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      langs: ${{ steps.langs.outputs.langs }}
    steps:
      - name: Checkout Ryoku
        uses: actions/checkout@v4
        with:
          path: ryoku

      - name: Checkout shell catalogue
        uses: actions/checkout@v4
        with:
          repository: Ryoku-dev/ryostore-revamped
          path: ryostore-revamped

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract English
        working-directory: ryoku
        run: python3 ryoku/i18n/tools/sync.py extract --store ../ryostore-revamped

      - name: List target languages
        id: langs
        working-directory: ryoku
        run: |
          echo "langs=$(python3 ryoku/i18n/tools/sync.py langs | grep -vx en | jq -R . | jq -cs .)" >>"$GITHUB_OUTPUT"

      - name: Keep the English catalogue
        uses: actions/upload-artifact@v4
        with:
          name: i18n-en
          path: ryoku/ryoku/i18n/catalog/en.json

  translate:
    name: Translate ${{ matrix.lang }}
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        lang: ${{ fromJSON(needs.extract.outputs.langs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Use the extracted English
        uses: actions/download-artifact@v4
        with:
          name: i18n-en
          path: ryoku/i18n/catalog

      - name: Translate missing strings
        # Prefer the LLM engine (domain prompt + glossary: correct word senses,
        # length kept in check) when a key is configured; otherwise fall back to
        # the free, keyless Google endpoint so the job still works with no secret.
        env:
          RYOKU_I18N_PROVIDER: openai
          RYOKU_I18N_URL: https://openrouter.ai/api/v1/chat/completions
          RYOKU_I18N_MODEL: ${{ vars.RYOKU_I18N_MODEL || 'google/gemini-2.5-flash' }}
          RYOKU_I18N_KEY: ${{ secrets.RYOKU_I18N_KEY }}
          RYOKU_I18N_WORKERS: '8'
          FORCE: ${{ inputs.force }}
          LANG_CODE: ${{ matrix.lang }}
        run: |
          flag=""
          [ "$FORCE" = "true" ] && flag="--force"
          if [ -n "$RYOKU_I18N_KEY" ]; then
            python3 -u ryoku/i18n/tools/sync.py sync --engine llm $flag "$LANG_CODE"
          else
            python3 -u ryoku/i18n/tools/sync.py sync $flag "$LANG_CODE"
          fi

      - name: Keep this language
        uses: actions/upload-artifact@v4
        with:
          name: i18n-${{ matrix.lang }}
          path: ryoku/i18n/catalog/${{ matrix.lang }}.json

  commit:
    name: Commit translations
    needs: [extract, translate]
    if: ${{ always() && needs.extract.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gather every finished language
        uses: actions/download-artifact@v4
        with:
          pattern: i18n-*
          path: ryoku/i18n/catalog
          merge-multiple: true

      - name: Report length and cost
        # advisory: surface translations that expand the UI (non-fatal), and
        # print what the pass cost so a model change is a decision with a
        # number attached.
        run: |
          python3 ryoku/i18n/tools/sync.py check || true
          python3 ryoku/i18n/tools/sync.py cost || true

      - name: Commit updated translations
        run: |
          if git diff --quiet -- ryoku/i18n/catalog; then
            echo "Translations already current."
            exit 0
          fi
          git config user.name "ryoku-i18n"
          git config user.email "noreply@ryoku"
          git add ryoku/i18n/catalog
          git commit -m "[ryoku] i18n: regenerate translations"
          # the version-bump job pushes to this same ref on every push, so our
          # push can lose the race. rebase onto whatever landed and retry; the
          # translations commit only touches ryoku/i18n/catalog, so it never
          # conflicts with the bump.
          for _ in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"
