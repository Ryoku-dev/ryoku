name: Refresh standalone app packages

# Ryotunes and Ryoport release independently of distro tags. Keep both mutable
# pacman channels current without rebuilding the desktop or changing snapshots.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish [ryoku] repo']
    types: [completed]

permissions:
  contents: read

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Refresh ${{ matrix.app }} in ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, testing]
        app: [ryotunes, ryoport]
    concurrency:
      group: publish-repo-${{ matrix.channel }}
      cancel-in-progress: false
    container:
      image: archlinux:latest
    steps:
      - name: Install repository tools
        run: pacman -Syu --noconfirm --needed git curl jq libarchive gnupg rclone diffutils
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Import and sign the current official release
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RYOKU_CHANNEL: ${{ matrix.channel }}
          RYOKU_APP: ${{ matrix.app }}
        run: bash release/repo/refresh-ryotunes.sh
