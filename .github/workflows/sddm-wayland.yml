name: SDDM Wayland greeter

on:
  pull_request:
    paths:
      - 'ryoku/lockscreen/sddm/**'
      - 'ryoku/cli/internal/doctor/doctor.go'
      - 'system/packages/base.packages'
      - 'system/services/manifest.tsv'
      - 'release/packages/ryoku-desktop/PKGBUILD'
      - 'release/packages/ryoku-desktop/payload.sh'
      - 'void/init/system/ryoku-greeter-guard/**'
      - 'tests/sddm-*.sh'
      - '.github/workflows/sddm-wayland.yml'
  push:
    branches:
      - main
    paths:
      - 'ryoku/lockscreen/sddm/**'
      - 'ryoku/cli/internal/doctor/doctor.go'
      - 'system/packages/base.packages'
      - 'system/services/manifest.tsv'
      - 'release/packages/ryoku-desktop/PKGBUILD'
      - 'release/packages/ryoku-desktop/payload.sh'
      - 'void/init/system/ryoku-greeter-guard/**'
      - 'tests/sddm-*.sh'
      - '.github/workflows/sddm-wayland.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  greeter-contract:
    name: Greeter uses Qt Wayland end to end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ryoku/cli/go.mod

      - name: Check Doctor's SDDM configuration
        shell: bash
        working-directory: ryoku/cli
        run: go test ./internal/doctor -run '^TestSDDMWaylandBodyForcesQtWayland$'
      - name: Check the installer and packages
        shell: bash
        run: RYOKU_PATH="$PWD" tests/sddm-wayland.sh
      - name: Check the keyring PAM wiring
        shell: bash
        run: RYOKU_PATH="$PWD" tests/sddm-keyring-pam.sh
      - name: Check the greeter compositor's card choice
        shell: bash
        run: RYOKU_PATH="$PWD" tests/sddm-greeter-card.sh
      - name: Check the greeter compositor survives weston dying
        shell: bash
        run: RYOKU_PATH="$PWD" tests/sddm-greeter-supervise.sh
      - name: Check the login screen guard
        shell: bash
        run: RYOKU_PATH="$PWD" tests/sddm-greeter-guard.sh
