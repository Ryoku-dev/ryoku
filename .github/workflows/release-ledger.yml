name: Release Ledger

# Rebuilds the stable and testing ledgers for Arch and Void from the frozen
# repository directories the bucket holds, with the same script each publish
# runs after a repository lands. Dispatch it when any ledger is missing or
# wrong; all four are derived, so a rebuild is always safe.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: Rebuild release ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest
    steps:
      - name: Install git for checkout
        run: pacman -Sy --noconfirm --needed git
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install rclone and jq
        run: pacman -Syu --noconfirm --needed rclone jq
      - name: Configure the bucket
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: ./bin/ryoku-r2-config
      - name: Rebuild all ledgers
        env:
          REMOTE: Ryoku:${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ./bin/ryoku-release-ledger "$REMOTE" arch stable | tee "$RUNNER_TEMP/index-arch-stable.json"
          ./bin/ryoku-release-ledger "$REMOTE" arch testing | tee "$RUNNER_TEMP/index-arch-testing.json"
          ./bin/ryoku-release-ledger "$REMOTE" void stable | tee "$RUNNER_TEMP/index-void-stable.json"
          ./bin/ryoku-release-ledger "$REMOTE" void testing | tee "$RUNNER_TEMP/index-void-testing.json"
          {
            for ledger in \
              "Arch stable:$RUNNER_TEMP/index-arch-stable.json" \
              "Arch testing:$RUNNER_TEMP/index-arch-testing.json" \
              "Void stable:$RUNNER_TEMP/index-void-stable.json" \
              "Void testing:$RUNNER_TEMP/index-void-testing.json"; do
              title=${ledger%%:*}
              file=${ledger#*:}
              echo "### $title release ledger"
              echo
              echo '```json'
              cat "$file"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
