name: Release Ledger

# Rebuilds the Arch and Void release ledgers from the release directories the
# bucket holds, with the same script each publish runs after a release lands.
# Dispatch it when either ledger is missing or wrong; both are derived, so a
# rebuild is always safe.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: Rebuild release ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest
    steps:
      - name: Install git for checkout
        run: pacman -Sy --noconfirm --needed git
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install rclone and jq
        run: pacman -Syu --noconfirm --needed rclone jq
      - name: Configure the bucket
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: ./bin/ryoku-r2-config
      - name: Rebuild both ledgers
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ./bin/ryoku-release-ledger "Ryoku:$R2_BUCKET" arch | tee "$RUNNER_TEMP/index-arch.json"
          ./bin/ryoku-release-ledger "Ryoku:$R2_BUCKET" void | tee "$RUNNER_TEMP/index-void.json"
          {
            echo "### Arch release ledger"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/index-arch.json"
            echo '```'
            echo
            echo "### Void release ledger"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/index-void.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
