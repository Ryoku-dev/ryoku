name: Go unit tests

# Build + test gates for the Go modules no other workflow covered: the ryoku
# CLI (update / doctor / materialize, the no-migrations delivery spine), the
# shell IPC daemon, the window-manager seam (ryoku/wm, vendored into every Go
# consumer), the standalone shell installer, and the store, Hub, and Rashin
# modules. The build step alone is load-bearing: these ship as prebuilt
# binaries or compile during ISO and package builds, and an IPC compile break
# once reached unstable-dev unseen because nothing built the package in CI.
# Rashin's one module includes its daemon, command line and Gio application.
# unstable-dev is in the push triggers for the same reason: that is the branch
# integration happens on.

on:
  pull_request:
    paths:
      - 'ryoku/cli/**'
      - 'ryoku/shell/ipc/**'
      - 'ryoku/wm/**'
      - 'ryoku-shell-installer/**'
      - 'installation/installerplan/**'
      - 'ryoku/apps/ryostore/backend/**'
      - 'ryoku/hub/backend/**'
      - 'ryoku/rashin/**'
      - '.github/workflows/go-unit-tests.yml'
  push:
    branches:
      - main
      - unstable-dev
    paths:
      - 'ryoku/cli/**'
      - 'ryoku/shell/ipc/**'
      - 'ryoku/wm/**'
      - 'ryoku-shell-installer/**'
      - 'installation/installerplan/**'
      - 'ryoku/apps/ryostore/backend/**'
      - 'ryoku/hub/backend/**'
      - 'ryoku/rashin/**'
      - '.github/workflows/go-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: ryoku CLI (update/doctor/materialize)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ryoku/cli/go.mod

      - name: Build, vet, and test
        shell: bash
        working-directory: ryoku/cli
        run: |
          go build ./...
          go vet ./...
          go test ./...

  shell-ipc:
    name: shell IPC daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ryoku/shell/ipc/go.mod

      - name: Build, vet, and test
        shell: bash
        working-directory: ryoku/shell/ipc
        run: |
          go build ./...
          go vet ./...
          go test -short ./...

  wm:
    name: window-manager seam (ryoku-wm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ryoku/wm/go.mod

      # ryoku/wm is vendored into the CLI, shell IPC, hub, rashin and ryogami
      # daemons, so a break here compiles nowhere and blocks the wm provider
      # binaries (ryoku-wm-hyprland / ryoku-wm-niri) the desktop ships.
      - name: Build, vet, and test
        shell: bash
        working-directory: ryoku/wm
        run: |
          go build ./...
          go vet ./...
          go test ./...

  installerplan:
    name: installer choices (ryoku-installerplan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installation/installerplan/go.mod

      # One manifest feeds the ISO TUI, the shell installer and both ISO
      # backends; a break here changes what every installer offers.
      - name: Build, vet, and test
        shell: bash
        working-directory: installation/installerplan
        run: |
          go build ./...
          go vet ./...
          go test ./...

  shell-installer:
    name: shell installer (binary parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ryoku-shell-installer/go.mod

      - name: Committed binary matches its committed checksum
        shell: bash
        working-directory: ryoku-shell-installer
        # install.sh verifies this checksum on every user's machine; a commit
        # that updates one without the other bricks the curl|bash bootstrap.
        # runs BEFORE the build: `go build ./...` overwrites the committed
        # binary in the checkout, so checking afterwards compares the runner's
        # own (non-reproduced) build and always fails.
        run: sha256sum -c ryoku-shell-install.sha256

      - name: Build, vet, and test
        shell: bash
        working-directory: ryoku-shell-installer
        run: |
          go build ./...
          go vet ./...
          go test ./...

  store-backend:
    name: store backend (catalogue providers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ryoku/apps/ryostore/backend/go.mod

      - name: Build, vet, and test
        shell: bash
        working-directory: ryoku/apps/ryostore/backend
        run: |
          go build ./...
          go vet ./...
          go test ./...

  hub-backend:
    name: hub backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ryoku/hub/backend/go.mod

      - name: Build, vet, and test
        shell: bash
        working-directory: ryoku/hub/backend
        run: |
          go build ./...
          go vet ./...
          go test ./...

  rashin:
    name: Rashin module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libvulkan-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ryoku/rashin/go.mod

      - name: Build, vet, and test
        shell: bash
        working-directory: ryoku/rashin
        run: |
          env -u WAYLAND_DISPLAY go build -tags nox11 ./...
          env -u WAYLAND_DISPLAY go vet -tags nox11 ./...
          env -u WAYLAND_DISPLAY go test -tags nox11 ./...
