name: QML Lint

# import warnings are advisory: the Ryoku surfaces import the Quickshell QML
# modules, which aren't installable on a stock CI runner, so qmllint can't
# resolve them and would flag environmental import errors as failures. read
# those as hints, then verify QML on a running system via
# ryoku/shell/dev-run.sh. a file that cannot PARSE is fatal: it never loads on
# any box. vendored qylock QML is exempt.

on:
  pull_request:
    paths:
      - '**/*.qml'
      - '**/qmldir'
      - '.github/workflows/qmllint.yml'
  push:
    branches:
      - main
      - unstable-dev
    paths:
      - '**/*.qml'
      - '**/qmldir'
      - '.github/workflows/qmllint.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: Files to lint
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read

jobs:
  qmllint:
    name: qmllint (syntax fatal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # bounded + retried: a stalled apt mirror held this step for over an hour.
      - name: Install Qt QML tooling
        shell: bash
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y -o Acquire::Retries=3 qt6-declarative-dev; then
              break
            fi
            if (( attempt == 2 )); then
              echo "::error::could not install the Qt QML tooling"
              exit 1
            fi
            echo "::warning::apt attempt $attempt failed; retrying"
            sleep 15
          done
          qmllint_bin="/usr/lib/qt6/bin/qmllint"
          [[ -x $qmllint_bin ]] || qmllint_bin="$(command -v qmllint || true)"
          [[ -n $qmllint_bin ]] || { echo "::warning::qmllint not found; skipping."; exit 0; }
          echo "QMLLINT_BIN=$qmllint_bin" >> "$GITHUB_ENV"

      - name: Collect QML files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          files="$(mktemp)"
          scope="${{ github.event.inputs.scope || 'changed' }}"

          collect() {
            while IFS= read -r -d '' f; do
              [[ -f $f ]] || continue
              case "$f" in
                ryoku/lockscreen/qylock/*) ;;   # vendored upstream, exempt
                *.qml) printf '%s\0' "$f" >>"$files" ;;
              esac
            done
          }

          if [[ $scope == all || $GITHUB_EVENT_NAME == push ]]; then
            git ls-files -z '*.qml' | collect
          elif [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            git diff --name-only --diff-filter=ACM -z \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" | collect
          else
            git ls-files -z '*.qml' | collect
          fi

          if [[ ! -s $files ]]; then
            echo "has_files=false" >>"$GITHUB_OUTPUT"
            echo "No QML files to lint."
            exit 0
          fi
          sort -zu "$files" > qmllint-files.txt
          echo "has_files=true" >>"$GITHUB_OUTPUT"

      - name: Run qmllint (advisory, syntax fatal)
        if: steps.files.outputs.has_files == 'true' && env.QMLLINT_BIN != ''
        shell: bash
        timeout-minutes: 30
        run: |
          set -uo pipefail
          out="$(mktemp)"
          one="$(mktemp)"
          while IFS= read -r -d '' f; do
            echo "::group::qmllint $f"
            # qmllint itself can spin forever on valid QML (the vendored
            # Nomarchy network panel does), and one such file used to hold
            # the whole job until the runner's six-hour limit. Actions runs
            # this with -e, so the status is caught rather than failing.
            rc=0
            timeout 120 "$QMLLINT_BIN" "$f" >"$one" 2>&1 || rc=$?
            tee -a "$out" <"$one"
            if (( rc == 124 )); then echo "::warning file=$f::qmllint gave up after 120 s"; fi
            echo "::endgroup::"
          done < qmllint-files.txt
          # import-resolution noise stays advisory; a file that cannot parse
          # at all never loads on any box, so it fails the job. a stray
          # backtick inside a QML template string closes the string and
          # produces exactly this class, and it shipped once, killing every
          # `ryoku reload` on the deployed shell.
          if grep -qE 'Expected token|Unexpected token|Syntax error' "$out"; then
            echo "::error::qmllint found QML that cannot parse (see groups above)"
            exit 1
          fi
          echo "qmllint is advisory for import warnings; syntax findings are fatal."
