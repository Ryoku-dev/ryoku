name: Delivery check

# Guards that what a dev box runs actually reaches an installed box, and that
# every Arch package has a built package or an explained translation for Void
# and Fedora. Publish lag stays a warning because main advances by a deliberate
# fast-forward. See docs/updates.md.

on:
  push:
    branches:
      - unstable-dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test edition parity gate
        run: bash tests/edition-parity.sh

      - name: Verify edition package parity
        run: bin/ryoku-edition-parity

      - name: Verify Fedora package dependencies
        run: bash tests/fedora-packages.sh

      - name: Verify Fedora's snapshot boot menu
        run: bash tests/snapshot-boot.sh

      - name: Verify every edition stages the same payload
        run: bash tests/payload-parity.sh

      - name: Verify update delivery
        run: |
          set -euo pipefail
          git fetch -q origin main unstable-dev 2>/dev/null || true
          bin/ryoku-dev-verify-delivery

      - name: Verify compositor isolation
        run: bin/ryoku-dev-verify-wm-isolation --quiet

      - name: Annotate publish lag
        if: always()
        run: |
          set -euo pipefail
          behind="$(git rev-list --count origin/main..origin/unstable-dev 2>/dev/null || echo 0)"
          if [[ ${behind:-0} -gt 0 ]]; then
            echo "::warning::origin/main is $behind commit(s) behind origin/unstable-dev; users get them only after main fast-forwards and publish-repo runs."
          fi
