name: Shima pinned source

on:
  push:
    branches:
      - feat/shima-pinned-upstream-runtime
    paths:
      - 'ryoku/shell/quickshell/shima-overlay/**'
      - 'ryoku/shell/scripts/ryoku-shima*'
      - 'ryoku/shell/ipc/shima*.go'
      - 'tests/test_shima_pinned_source.py'
      - '.github/workflows/shima-pinned-source.yml'
  pull_request:
    paths:
      - 'ryoku/shell/quickshell/shima-overlay/**'
      - 'ryoku/shell/scripts/ryoku-shima*'
      - 'ryoku/shell/ipc/shima*.go'
      - 'tests/test_shima_pinned_source.py'
      - '.github/workflows/shima-pinned-source.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream source
        run: |
          curl -fsSL --retry 3 --max-time 150 "https://codeload.github.com/snowarch/iNiR/tar.gz/48cdcecb0f6089cfbb7019054602eab28e154b3b" -o "$RUNNER_TEMP/inir.tar.gz"
      - name: Verify archive and assembled runtime
        env:
          SHIMA_TEST_ARCHIVE: ${{ runner.temp }}/inir.tar.gz
        run: python3 -m unittest discover -s tests -p test_shima_pinned_source.py

  supervisor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ryoku/shell/ipc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ryoku/shell/ipc/go.mod
          cache-dependency-path: ryoku/shell/ipc/go.sum
      - name: Verify native Shima lifecycle
        run: go test ./... -run '^TestShima' -count=1
