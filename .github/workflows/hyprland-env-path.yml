name: Hyprland PATH

on:
  pull_request:
    paths:
      - 'ryoku/hyprland/modules/env.lua'
      - 'tests/hyprland-env-path.lua'
      - '.github/workflows/hyprland-env-path.yml'
  push:
    branches:
      - main
      - unstable-dev
    paths:
      - 'ryoku/hyprland/modules/env.lua'
      - 'tests/hyprland-env-path.lua'
      - '.github/workflows/hyprland-env-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: PATH regression
        run: |
          luac5.4 -p ryoku/hyprland/modules/env.lua tests/hyprland-env-path.lua
          lua5.4 tests/hyprland-env-path.lua
